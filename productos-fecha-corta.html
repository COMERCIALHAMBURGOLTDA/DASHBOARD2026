<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos con Fecha Corta</title>

<style>

/* Diseño adaptable: la información se mantiene completa en todas las pantallas. */
*, *::before, *::after { box-sizing: border-box; }

body {
    background: white;
    color: black;
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    min-width: 0;
}

/* CABECERA */
.header {
    text-align: center;
    padding: clamp(14px, 2vw, 25px);
    border-bottom: 3px solid #1e3a8a;
}

h1 {
    margin: 0;
    font-size: clamp(23px, 3vw, 46px);
    line-height: 1.15;
    color: #1e3a8a;
    font-weight: 700;
}

.subtitulo {
    margin-top: 8px;
    color: #555;
    font-weight: 600;
    font-size: clamp(12px, 1vw, 16px);
}

/* TABLA DE ESCRITORIO: las 14 columnas caben sin desplazamiento horizontal. */
.container {
    width: 100%;
    padding: clamp(8px, 1.2vw, 20px);
    max-height: 85vh;
    max-height: 85dvh;
    overflow-y: auto;
    overflow-x: hidden;
}

table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: clamp(11px, 0.9vw, 16px);
    line-height: 1.3;
    font-weight: 600;
}

thead {
    background: #111827;
    color: white;
    position: sticky;
    top: 0;
    z-index: 2;
}

th {
    padding: clamp(5px, .55vw, 10px) clamp(2px, .3vw, 6px);
    font-weight: 700;
}

td {
    padding: clamp(5px, .55vw, 10px) clamp(2px, .3vw, 6px);
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
    vertical-align: middle;
    font-weight: 600;
}

th, td {
    overflow-wrap: anywhere;
    hyphens: auto;
}

/* En vista de escritorio no se muestran las etiquetas de las fichas. */
td::before { content: none; }

/* PARPADEO */
@keyframes blink {
    0% { opacity: 1; }
    40% { opacity: 1; }
    60% { opacity: .5; }
    100% { opacity: 1; }
}

/* COLORES ORIGINALES */
.vencido { background: #000000; color: white; animation: blink 2.5s infinite; }
.menos15 { background: #7e22ce; color: white; animation: blink 2.5s infinite; }
.menos30 { background: #ef4444; color: white; animation: blink 2.5s infinite; }
.menos60 { background: #facc15; color: black; }
.normal { background: white; color: black; }
.subtotal { background: #e5e7eb; color: black; font-weight: 700; }
.alertaIcon { font-size: 1em; margin-right: 5px; }

/* TABLET Y CELULAR: cada producto muestra los 14 campos sin recortar datos. */
@media (max-width: 1150px) {
    .container { max-height: none; overflow: visible; }
    table, tbody { display: block; width: 100%; }
    colgroup, thead { display: none; }

    tbody tr:not(.subtotal) {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        margin-bottom: 12px;
        padding: 8px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(17, 24, 39, .12);
    }

    tbody tr:not(.subtotal) td {
        display: block;
        min-width: 0;
        padding: 9px 10px;
        border-bottom: 1px solid rgba(128, 128, 128, .2);
        text-align: left;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    tbody tr:not(.subtotal) td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 3px;
        font-size: 11px;
        font-weight: 700;
        opacity: .78;
    }

    tbody tr:not(.subtotal) td:nth-child(7) { grid-column: span 2; }

    tbody tr.subtotal {
        display: block;
        margin: 0 0 14px;
        padding: 10px 14px;
        border-radius: 8px;
    }
    tbody tr.subtotal td:first-child { display: none; }
    tbody tr.subtotal td:last-child {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        text-align: right;
        font-size: 14px;
        overflow-wrap: anywhere;
    }
}

@media (max-width: 650px) {
    tbody tr:not(.subtotal) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    tbody tr:not(.subtotal) td:nth-child(7) { grid-column: 1 / -1; }
    tbody tr:not(.subtotal) td { font-size: 13px; }
    .header { padding: 15px 10px; }
    h1 { font-size: clamp(20px, 5.8vw, 30px); }
}

</style>
</head>

<body>

<div class="header">
<h1>PRODUCTOS CON FECHA CORTA</h1>
<div class="subtitulo" id="ultimaActualizacion"></div>
</div>

<div class="container">

<table id="tabla">
<colgroup>
<col style="width:2.8%"><col style="width:6%"><col style="width:7.3%">
<col style="width:6%"><col style="width:5.5%"><col style="width:7.2%">
<col style="width:19%"><col style="width:4.5%"><col style="width:5.5%">
<col style="width:8%"><col style="width:3.8%"><col style="width:8.5%">
<col style="width:9.4%"><col style="width:6.5%">
</colgroup>

<thead>
<tr>
<th>#</th>
<th>Bodega</th>
<th>Nivel</th>
<th>Pasillo</th>
<th>Rack</th>
<th>Código Venta</th>
<th>Producto</th>
<th>Bultos</th>
<th>Unidades</th>
<th>Vencimiento</th>
<th>Días</th>
<th>Total $</th>
<th>Última actualización</th>
<th>Usuario</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const ahora=new Date()

document.getElementById("ultimaActualizacion").innerText=
"Actualizado: "+ahora.toLocaleString("es-CL",{hour12:false})

function parseCSV(text){

const rows=[]
let row=[]
let current=""
let insideQuotes=false

for(let i=0;i<text.length;i++){

const char=text[i]

if(char=='"'){
insideQuotes=!insideQuotes
continue
}

if(char==","&&!insideQuotes){
row.push(current)
current=""
continue
}

if((char=="\n"||char=="\r")&&!insideQuotes){

if(current||row.length){
row.push(current)
rows.push(row)
row=[]
current=""
}

continue
}

current+=char
}

if(current||row.length){
row.push(current)
rows.push(row)
}

return rows
}

// BD conserva la informacion del producto, existencias, vencimiento y valorizacion.
const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vSzxaEsuaeqHWRDtqYiuiIMz7U75VCuIrc3VT2NCZLfwIfJupi4pc5o5LN8b-hSgoY3b_qLD3aPocdm/pub?output=csv"

// CONSOLIDADO aporta la ultima fecha y el usuario de cada ID UBICACION.
const urlConsolidado="https://docs.google.com/spreadsheets/d/e/2PACX-1vRCAN1uH1IpPYi5jgPZOmFWZ72KV5mGjKcpjMUD4PrX4n0i0H42XiXqepYv8ITYp4cWjRvfVIJ8pxY4/pub?gid=344906568&single=true&output=csv"

function normalizarUbicacion(valor) {
  let id=String(valor ?? "").trim().replace(/^'+/, "");
  // Google Sheets puede representar el mismo ID numerico como 262 o 262.0.
  if (/^\d+(?:\.0+)?$/.test(id)) {
    id=String(Number(id));
  }
  return id;
}

function normalizarEncabezado(valor) {
  return String(valor ?? "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function obtenerActualizaciones(textoCSV) {
  const registros=parseCSV(textoCSV);
  if (!registros.length) throw new Error("El consolidado esta vacio.");

  const encabezados=registros[0].map(normalizarEncabezado);
  const indiceID=encabezados.indexOf("ID UBICACION");
  const indiceUsuario=encabezados.indexOf("USUARIO CONSULTA") >= 0
    ? encabezados.indexOf("USUARIO CONSULTA") : encabezados.indexOf("USUARIO");
  const indiceFecha=encabezados.indexOf("FECHA CONSULTA") >= 0
    ? encabezados.indexOf("FECHA CONSULTA") : encabezados.indexOf("FECHA AJUSTE");

  if (indiceID < 0 || indiceUsuario < 0 || indiceFecha < 0) {
    throw new Error("El CSV consolidado no contiene ID UBICACION, USUARIO o FECHA AJUSTE.");
  }

  const actualizaciones=new Map();
  // El consolidado se ordena del mas reciente al mas antiguo en Apps Script.
  // Por eso, la primera fila encontrada para cada ubicacion es la mas nueva.
  for (const fila of registros.slice(1)) {
    const id=normalizarUbicacion(fila[indiceID]);
    if (!id || actualizaciones.has(id)) continue;
    actualizaciones.set(id, {
      fecha:String(fila[indiceFecha] ?? "").trim(),
      usuario:String(fila[indiceUsuario] ?? "").trim()
    });
  }
  return actualizaciones;
}

async function obtenerCSV(direccion) {
  const respuesta=await fetch(direccion, {cache:"no-store"});
  if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
  return respuesta.text();
}

Promise.all([
  obtenerCSV(url),
  obtenerCSV(urlConsolidado).then(obtenerActualizaciones).catch(error => {
    console.error("No se pudo cargar CONSOLIDADO:", error);
    return null;
  })
])
.then(([textoBD, actualizaciones])=>{

const data=parseCSV(textoBD)
const filas=data.slice(1)

if (!actualizaciones) {
  document.getElementById("ultimaActualizacion").innerText +=
    " | Sin acceso a CONSOLIDADO; se muestran las fechas de BD";
}

const tbody=document.querySelector("#tabla tbody")

let contador=1

let vencidos=[]
let menos15=[]
let menos30=[]
let menos60=[]
let normal=[]

let subtotalVencidos=0
let subtotal15=0
let subtotal30=0
let subtotal60=0
let subtotalNormal=0

filas.forEach(col=>{

const bodega=col[1]
const nivel=col[2]
const pasillo=col[3]
const rack=col[4]
const codigoVenta=col[7]
const descripcion=col[8]
const bultos=col[9]
const unidades=col[10]
const vencimiento=col[11]

const totalRaw=col[15]
const total=totalRaw?totalRaw.replace(/[^\d]/g,""):"0"

const idUbicacion=normalizarUbicacion(col[0])
const cambio=actualizaciones?.get(idUbicacion)
const ultimaActualizacion=cambio?.fecha || col[16] || "Sin registro"
const usuario=cambio?.usuario || col[17] || "Sin registro"

if(!vencimiento) return

const partes=vencimiento.split("/")
const fechaV=new Date(partes[2],partes[1]-1,partes[0])

const hoy=new Date()
const diff=Math.ceil((fechaV-hoy)/(1000*60*60*24))

const fila={
bodega,nivel,pasillo,rack,codigoVenta,descripcion,bultos,unidades,vencimiento,diff,total,ultimaActualizacion,usuario
}

if(diff<0){
vencidos.push(fila)
subtotalVencidos+=Number(total)
}
else if(diff<=15){
menos15.push(fila)
subtotal15+=Number(total)
}
else if(diff<=30){
menos30.push(fila)
subtotal30+=Number(total)
}
else if(diff<=60){
menos60.push(fila)
subtotal60+=Number(total)
}
else{
normal.push(fila)
subtotalNormal+=Number(total)
}

})

vencidos.sort((a,b)=>a.diff-b.diff)
menos15.sort((a,b)=>a.diff-b.diff)
menos30.sort((a,b)=>a.diff-b.diff)
menos60.sort((a,b)=>a.diff-b.diff)
normal.sort((a,b)=>a.diff-b.diff)

function imprimirGrupo(grupo,clase){

grupo.forEach(f=>{

const totalFormateado=new Intl.NumberFormat("es-CL").format(Number(f.total))

let icono=""
if(f.diff<=15){
icono='<span class="alertaIcon">⚠</span>'
}

const tr=document.createElement("tr")
tr.className=clase

tr.innerHTML=`
<td data-label="#">${contador}</td>
<td data-label="Bodega">${f.bodega}</td>
<td data-label="Nivel">${f.nivel}</td>
<td data-label="Pasillo">${f.pasillo}</td>
<td data-label="Rack">${f.rack}</td>
<td data-label="Código Venta">${f.codigoVenta}</td>
<td data-label="Producto">${icono}${f.descripcion}</td>
<td data-label="Bultos">${f.bultos}</td>
<td data-label="Unidades">${f.unidades}</td>
<td data-label="Vencimiento">${f.vencimiento}</td>
<td data-label="Días">${f.diff}</td>
<td data-label="Total $">$ ${totalFormateado}</td>
<td data-label="Última actualización">${f.ultimaActualizacion}</td>
<td data-label="Usuario">${f.usuario}</td>
`

tbody.appendChild(tr)

contador++

})

}

function subtotalFila(texto,valor){

const fila=document.createElement("tr")
fila.className="subtotal"

const monto=new Intl.NumberFormat("es-CL").format(valor)

fila.innerHTML=`
<td colspan="11"></td>
<td colspan="3">Subtotal ${texto}: $ ${monto}</td>
`

tbody.appendChild(fila)

}

imprimirGrupo(vencidos,"vencido")
subtotalFila("Vencidos",subtotalVencidos)

imprimirGrupo(menos15,"menos15")
subtotalFila("< 15 días",subtotal15)

imprimirGrupo(menos30,"menos30")
subtotalFila("15 - 30 días",subtotal30)

imprimirGrupo(menos60,"menos60")
subtotalFila("30 - 60 días",subtotal60)

imprimirGrupo(normal,"normal")
subtotalFila("> 60 días",subtotalNormal)

})
.catch(error=>{
  console.error("No se pudieron cargar los productos:",error);
  document.getElementById("ultimaActualizacion").innerText=
    "No se pudieron cargar los datos de productos. Reintenta actualizar la pagina.";
})

setTimeout(()=>location.reload(),60000)

</script>

</body>
</html>
