<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Checklist Inicio</title>

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
    font-size:60px;
}

.lista{
    width:70%;
    margin:auto;
    font-size:35px;
    margin-top:80px;
}

.item{
    margin:30px 0;
}

input{
    transform:scale(2);
    margin-right:20px;
}

.completado{
    color:#4ade80;
}

</style>

</head>

<body>

<h1>CHECKLIST INICIO DE TURNO</h1>

<div class="lista">

<div class="item">
<input type="checkbox" onclick="marcar(this)">
Revisión de cámaras
</div>

<div class="item">
<input type="checkbox" onclick="marcar(this)">
Revisión de temperatura cámaras
</div>

<div class="item">
<input type="checkbox" onclick="marcar(this)">
Verificación de despachos programados
</div>

<div class="item">
<input type="checkbox" onclick="marcar(this)">
Limpieza zona de carga
</div>

</div>

<a href="index.html">⬅ Volver</a>

<script>

function marcar(checkbox){

    const item = checkbox.parentElement

    if(checkbox.checked){
        item.classList.add("completado")
    }else{
        item.classList.remove("completado")
    }

}

</script>

</body>
</html>
